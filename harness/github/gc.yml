# Promote-before-evict: L1 (7d LRU) → L3 actos/fs before GitHub drops the edge.
# Mutex on the VFS. Never force-push actos/fs.

name: actos-gc

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: actos-fs
  cancel-in-progress: false

jobs:
  gc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Attach L3 origin (actos/fs)
        run: git fetch origin refs/heads/actos/fs:refs/heads/actos/fs

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Restore L1 (to inspect / promote)
        uses: actions/cache@v5
        with:
          path: .actos-l1
          key: actos-l1-${{ github.sha }}
          restore-keys: |
            actos-l1-

      - name: Promote L1 → L3 + /proc/stat
        run: npx tsx src/cli/gc.ts --sync

      - name: Push origin disk
        run: npx tsx src/cli/fs-sync.ts --push
