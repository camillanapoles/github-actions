name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Seed + smoke agent (serverless runtime analog)
        run: |
          npm run seed
          npx tsx src/cli/agent.ts --goal "smoke: resolver execução e cachear"
