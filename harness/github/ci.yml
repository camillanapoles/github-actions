name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_NO_WARNINGS: "1"
      ACTOS_FILEDB: "1"
      ACTOS_GITFS: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: QA — testes de validação e sucesso
        run: npm test
      - name: Seed + smoke agent (serverless runtime analog)
        run: |
          npm run seed
          npx tsx src/cli/agent.ts --goal "smoke: resolver execução e cachear"

  arena-session-notice:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'arena/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Inject best practice (non-commit return)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npx --yes tsx src/cli/inject-session-notice.ts
