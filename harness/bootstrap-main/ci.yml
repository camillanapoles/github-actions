name: ci

on:
  workflow_dispatch:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      NODE_NO_WARNINGS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'arena/01a01e33-github-actions' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
