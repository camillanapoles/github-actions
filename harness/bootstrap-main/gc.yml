name: actos-gc

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: actos-fs
  cancel-in-progress: false

jobs:
  gc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a01e33-github-actions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .actos-l1
          key: actos-l1-${{ github.run_id }}
          restore-keys: actos-l1-
      - run: npx tsx src/cli/gc.ts --promote
      - run: npx tsx src/cli/fs-sync.ts --push
        continue-on-error: true
